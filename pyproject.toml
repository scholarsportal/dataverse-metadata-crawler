[build-system]  # https://docs.astral.sh/uv/concepts/build-backend/
requires = ["uv_build>=0.11.30,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "dvmeta"

[project]  # https://packaging.python.org/en/latest/specifications/pyproject-toml/
name = "dataverse-metadata-crawler"
version = "0.1.6"
description = "A Python CLI tool for bulk extracting and exporting metadata from Dataverse repositories' collections to JSON and CSV formats."
readme = "README.md"
authors = [
  { name = "Ken Lui", email = "kenlh.lui@utoronto.ca" },
]
requires-python = ">=3.11,<4.0"
dependencies = [
  "typer>=0.15.1",
  "pydantic>=2.0.0",
  "pydantic-settings (>=2.0.0)",
  "httpx2>=2.0.0",
  "orjson>=3.10.14",
  "asyncio>=3.4.3",
  "jmespath>=1.0.1",
  "jinja2>=3.1.5",
  "ipykernel>=6.29.5",
  "ipywidgets>=8.1.5",
  "loguru>=0.7.3",
  "dv-schema-models==0.10.0",
]

[project.scripts]  # https://docs.astral.sh/uv/concepts/projects/config/#command-line-interfaces
dataverse-metadata-crawler = "dvmeta.cli.app:app"
dvmeta = "dvmeta.app:app"

[project.urls]  # https://packaging.python.org/en/latest/specifications/well-known-project-urls/#well-known-labels
homepage = "https://github.com/kenlhlui/dataverse-metadata-crawler"
source = "https://github.com/kenlhlui/dataverse-metadata-crawler"
changelog = "https://github.com/kenlhlui/dataverse-metadata-crawler/blob/main/CHANGELOG.md"
releasenotes = "https://github.com/kenlhlui/dataverse-metadata-crawler/releases"
documentation = "https://kenlhlui.github.io/dataverse-metadata-crawler"
issues = "https://github.com/kenlhlui/dataverse-metadata-crawler/issues"

[dependency-groups]  # https://docs.astral.sh/uv/concepts/projects/dependencies/#development-dependencies
dev = [
  "codespell (>=2.4.1)",
  "commitizen (>=4.3.0)",
  "ipykernel (>=6.29.4)",
  "ipython (>=8.18.0)",
  "ipywidgets (>=8.1.2)",
  "zensical (>=0.0.51)",
  "mkdocstrings[python] (>=0.26.2)",
  "poethepoet (>=0.32.1)",
  "prek (>=0.4.0)",
  "pytest (>=8.3.4)",
  "pytest-mock (>=3.14.0)",
  "pytest-xdist (>=3.6.1)",
  "ruff (>=0.9.2)",
  "ty (>=0.0.6)",
  "mkdocstrings-python (>=2.0.5)",
  "pytest-cov>=7.1.0",
]

[tool.codespell]  # https://github.com/codespell-project/codespell
builtin = "en-GB_to_en-US,clear,code,rare"
check-filenames = true
skip = "./*_cache/,./.venv,./reports,./site,./exported_files"
ignore-words-list="Jupyter"

[tool.commitizen]  # https://commitizen-tools.github.io/commitizen/config/
bump_message = "bump: v$current_version → v$new_version"
tag_format = "v$version"
update_changelog_on_bump = true
version_provider = "uv"
version_scheme = "pep440"

[tool.coverage.report]  # https://coverage.readthedocs.io/en/latest/config.html#report
precision = 1
show_missing = true
skip_covered = true

[tool.coverage.run]  # https://coverage.readthedocs.io/en/latest/config.html#run
branch = true
command_line = "--module pytest"
data_file = "reports/.coverage"
source = ["src"]

[tool.coverage.xml]  # https://coverage.readthedocs.io/en/latest/config.html#xml
output = "reports/coverage.xml"

[tool.pytest.ini_options]  # https://docs.pytest.org/en/latest/reference/reference.html#ini-options-ref
addopts = "--color=yes --doctest-modules --exitfirst --failed-first --verbosity=2 --junitxml=reports/pytest.xml"
testpaths = ["src", "tests"]
xfail_strict = true

[tool.ruff]  # https://docs.astral.sh/ruff/settings/
fix = true
line-length = 100
src = ["src", "tests"]
target-version = "py310"

[tool.ruff.format]
docstring-code-format = true
skip-magic-trailing-comma = true

[tool.ruff.lint]
select = ["ALL"]
ignore = ["CPY", "FIX", "T20", "ARG001", "COM812", "D203", "D213", "E501", "PD008", "PD009", "PGH003", "RET504", "S101", "TD003"]
unfixable = ["ERA001", "F401", "F841", "T201", "T203"]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true
ignore-fully-untyped = true

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.lint.pycodestyle]
max-doc-length = 100

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ty.environment]
python-platform = "all"

[tool.ty.rules]
unused-ignore-comment = "warn"

[tool.poe.executor]  # https://github.com/nat-n/poethepoet
type = "simple"

[tool.poe.tasks]

  [tool.poe.tasks.docs]
  help = "Build or serve the documentation"
  shell = """
    if [ $serve ]
    then {
      zensical serve
    } else {
      zensical build
    } fi
    """

    [[tool.poe.tasks.docs.args]]
    help = "Serve the documentation locally with live reload"
    type = "boolean"
    name = "serve"
    options = ["--serve"]

  [tool.poe.tasks.lint]
  help = "Lint this package"
  cmd = """
    prek run
      --all-files
      --color always
    """

  [tool.poe.tasks.test]
  help = "Test this package"
  cmd = "pytest --cov=src --cov-report=html --cov-report=xml"
